<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คำนวณเงินเดือน</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f0f2f5">
    <link rel="apple-touch-icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb; /* ปรับสีหลักให้เข้มขึ้นสู้กับพื้นขาว */
            --primary-glow: rgba(37, 99, 235, 0.3);
            --accent: #7c3aed;
            --success: #059669;
            --danger: #dc2626;
            --bg-light: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.85); /* พื้นหลังการ์ดสีขาวกึ่งโปร่งใส */
            --glass-border: rgba(0, 0, 0, 0.08); /* เส้นขอบสีเทาอ่อน */
            --text-main: #0f172a; /* สีตัวหนังสือหลัก */
            --text-muted: #64748b; /* สีตัวหนังสือรอง */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', 'Chakra Petch', sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom);
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        /* --- Glassmorphism & Neumorphism Elements --- */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 10px 10px 20px #bebebe, -10px -10px 20px #ffffff; /* เอฟเฟกต์ Neumorphism 3D */
        }

        .container { max-width: 1200px; margin: 20px auto; padding: 25px; }

        /* --- Header & Branding --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .brand { display: flex; align-items: center; gap: 15px; }
        .brand-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* --- Hero Stats --- */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-main-card {
            padding: 30px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .stat-label { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 42px; font-weight: 800; margin: 10px 0; font-family: 'Inter'; color: var(--text-main); }

        /* --- Config Inputs --- */
        .config-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
        }

        .input-box {
            background: #e6e9ef; /* Neumorphic inset background */
            box-shadow: inset 5px 5px 10px #bebebe, inset -5px -5px 10px #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px 15px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 16px;
            width: 100%;
            transition: 0.3s;
        }

        .input-box:focus { border: none; outline: none; box-shadow: inset 5px 5px 10px #bebebe, inset -5px -5px 10px #ffffff, 0 0 0 3px var(--primary-glow); }

        /* --- Modern Table (Desktop) --- */
        .table-container {
            border-radius: 20px;
            background: #ffffff;
        }

        table { width: 100%; border-collapse: collapse; min-width: 100%; }
        th { padding: 20px; text-align: center; font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px 10px; border-bottom: 1px solid #f1f5f9; text-align: center; }

        .time-input {
            width: 85px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px;
            color: var(--text-main);
            text-align: center;
            font-weight: 700;
            transition: 0.2s;
        }
        
        .time-input:focus { border-color: var(--primary); background: #ffffff; outline: none; }

        /* --- Login Experience --- */
        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
            background: #ffffff;
        }

        .password-container {
            position: relative;
            margin-bottom: 20px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
        }

        .toggle-password:hover { color: var(--primary); }

        .btn-glow {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border: none;
            border-radius: 14px;
            color: white;
            padding: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        .btn-glow:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4); }

        /* --- Status Colors (ปรับให้สว่างขึ้นสำหรับธีมขาว) --- */
        .row-holiday { background: rgba(239, 68, 68, 0.08); } /* แดงอ่อน */
        .row-vacation { background: rgba(16, 185, 129, 0.1); } /* เขียวอ่อน */
        .row-sick { background: rgba(245, 158, 11, 0.1); } /* เหลือง/ส้มอ่อน */

        /* --- Responsive Styles for Mobile Table (Card Block Design) --- */
        @media (max-width: 768px) {
            .container { padding: 15px; margin: 10px auto; }
            .stat-value { font-size: 32px; }
            .header { flex-direction: column; gap: 15px; }

            /* แปลงตารางเป็นบล็อกการ์ดบนมือถือ */
            .table-container table { display: block; border: none; }
            .table-container thead { display: none; } /* ซ่อนหัวตาราง */
            
            .table-container tbody { display: block; }
            .table-container tr {
                display: block; /* แปลงแถวเป็นบล็อก */
                border-bottom: 2px solid var(--glass-border);
                margin-bottom: 15px;
                padding: 10px;
                border-radius: 15px;
                background: #fff;
                box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            }
            
            .table-container td {
                display: flex; /* จัดช่องเป็นแถวเดียว */
                justify-content: space-between;
                align-items: center;
                text-align: right;
                padding: 8px 5px;
                border-bottom: none;
            }

            /* เพิ่มป้ายกำกับคอลัมน์อัตโนมัติบนมือถือด้วย data-label */
            .table-container td::before {
                content: attr(data-label); /* ดึงป้ายกำกับจาก HTML data-label */
                font-weight: 700;
                color: var(--text-muted);
                text-align: left;
                flex: 1; /* ป้ายกำกับกินพื้นที่ทางซ้าย */
            }

            .table-container td input.time-input {
                flex: 1; /* ช่องเวลากินพื้นที่ทางขวา */
                max-width: 45%;
                margin: 0 2px;
            }

            .table-container td.hide-mobile,
            .table-container td.not-essential {
                display: none; /* ซ่อนช่องที่ไม่จำเป็นบนมือถือ เช่น หมายเหตุ, ฯลฯ */
            }
        }
    </style>
</head>
<body>

<div id="loginSection">
    <div class="glass-panel login-card animate-fade">
        <div class="brand" style="justify-content: center; margin-bottom: 30px;">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="2" stroke-linecap="round">
                <defs><linearGradient id="grad"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient></defs>
                <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <h1 class="brand-text" style="font-size: 28px;">ระบบจัดการเงินเดือน</h1>
        </div>
        <input type="email" id="emailInput" class="input-box" style="margin-bottom: 15px;" placeholder="อีเมลผู้ใช้งาน">
        <div class="password-container">
            <input type="password" id="passwordInput" class="input-box" placeholder="รหัสผ่าน">
            <span class="toggle-password" id="togglePassword">👁️</span> </div>
        <button class="btn-glow" onclick="window.login()">เข้าสู่ระบบ</button>
    </div>
</div>

<div id="appSection" class="container glass-panel animate-fade" style="display: none;">
    <div class="header">
        <div class="brand">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="url(#grad2)" stroke-width="2.5">
                <defs><linearGradient id="grad2"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient></defs>
                <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="brand-text">แดชบอร์ดระบบเงินเดือน</span>
        </div>
        <div style="display: flex; gap: 15px;">
            <select id="monthPicker" class="input-box" style="width: 150px; font-weight: 600;" onchange="initTable()">
                <option value="0">มกราคม</option><option value="1">กุมภาพันธ์</option><option value="2">มีนาคม</option>
                <option value="3">เมษายน</option><option value="4" selected>พฤษภาคม</option><option value="5">มิถุนายน</option>
                <option value="6">กรกฎาคม</option><option value="7">สิงหาคม</option><option value="8">กันยายน</option>
                <option value="9">ตุลาคม</option><option value="10">พฤศจิกายน</option><option value="11">ธันวาคม</option>
            </select>
            <button onclick="logout()" style="background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 15px; border-radius: 12px; cursor: pointer; font-weight: 700; transition: 0.2s;">ออกจากระบบ</button>
        </div>
    </div>

    <div class="hero-grid">
        <div class="glass-panel stat-main-card">
            <div class="stat-label">รายรับสุทธิ (เดือนปัจจุบัน)</div>
            <div id="sumNet" class="stat-value">฿0.00</div>
            <div id="workedMonth" style="font-size: 14px; color: var(--primary); font-weight: 700;">0.0 ชั่วโมงทำงานสะสม</div>
        </div>
        <div class="glass-panel stat-main-card">
            <div class="stat-label">รายได้รวมทั้งปี 2026 (YTD)</div>
            <div id="yearTotal" class="stat-value" style="background: linear-gradient(to right, #ea580c, #d97706); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">฿0</div>
            <div id="sumOt" style="font-size: 14px; color: var(--success); font-weight: 700;">+฿0.00 ค่าล่วงเวลา (OT)</div>
        </div>
    </div>

    <div class="config-bar">
        <div><label class="stat-label">เงินเดือนพื้นฐาน</label><input type="text" id="salary" class="input-box" oninput="formatMoney(this)" value="30,000" style="font-weight: 600;"></div>
        <div><label class="stat-label">ค่าเดินทาง</label><input type="text" id="moving" class="input-box" oninput="formatMoney(this)" value="0" style="font-weight: 600;"></div>
        <div><label class="stat-label">ค่าครองชีพ</label><input type="text" id="living" class="input-box" oninput="formatMoney(this)" value="0" style="font-weight: 600;"></div>
        <div style="display: flex; flex-direction: column; justify-content: center;">
            <div class="stat-label">สถิติการลา</div>
            <div id="mLeaveBox" style="font-size: 14px; font-weight: 700; color: var(--text-main); margin-top: 10px;">ป่วย: 0 | กิจ: 0 | พักร้อน: 0</div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>วันที่</th>
                    <th>เวลาเข้า-ออกงาน</th>
                    <th>ประเภทวัน</th>
                    <th>หมายเหตุ</th>
                    <th>เวลารวม / ชม. OT</th>
                    <th>เงิน OT</th>
                </tr>
            </thead>
            <tbody id="workTable"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJnRAKZknvX6jhQYPpOuM9fUGHiL5521A", 
      authDomain: "my-payroll-app-4e527.firebaseapp.com",
      databaseURL: "https://my-payroll-app-4e527-default-rtdb.firebaseio.com",
      projectId: "my-payroll-app-4e527",
      storageBucket: "my-payroll-app-4e527.firebasestorage.app",
      messagingSenderId: "472001377405",
      appId: "1:472001377405:web:d77ca10e52d2918c5c2d14"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    const auth = getAuth(app);

    const year = 2026;
    const statsNames = { normal:"วันทำงานปกติ", holiday:"วันหยุด", sick:"ลาป่วย", personal:"ลากิจ", vacation:"ลาพักร้อน" };
    let db = { days: {}, configs: {} };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            startSync();
        } else {
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('appSection').style.display = 'none';
        }
    });

    window.login = () => {
        const email = document.getElementById('emailInput').value.trim();
        const pass = document.getElementById('passwordInput').value.trim();
        signInWithEmailAndPassword(auth, email, pass).catch((error) => {
            alert(`เข้าสู่ระบบไม่สำเร็จ!\nสาเหตุ: ${error.code}\nรายละเอียด: ${error.message}`);
        });
    };

    window.logout = () => signOut(auth);

    // ฟังก์ชันลูกตาแสดง/ซ่อนรหัสผ่าน
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('passwordInput');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.innerText = '👓'; // เปลี่ยนไอคอนเมื่อแสดง
        } else {
            passwordInput.type = 'password';
            this.innerText = '👁️'; // เปลี่ยนไอคอนเมื่อซ่อน
        }
    });

    function startSync() {
        onValue(ref(rtdb, 'payroll_data_2026'), (snap) => {
            db = snap.val() || { days: {}, configs: {} };
            initTable();
        });
    }

    window.initTable = () => {
        const tbody = document.getElementById('workTable');
        const m = parseInt(document.getElementById('monthPicker').value);
        tbody.innerHTML = "";
        
        const conf = db.configs[m] || { salary: "30,000", moving: "0", living: "0" };
        document.getElementById('salary').value = conf.salary;
        document.getElementById('moving').value = conf.moving || "0";
        document.getElementById('living').value = conf.living || "0";
        
        const days = new Date(year, m + 1, 0).getDate();
        const thaiDays = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

        for (let i = 1; i <= days; i++) {
            const key = `${m}-${i}`;
            const d = db.days[key] || {};
            const date = new Date(year, m, i);
            const isWE = date.getDay() === 0 || date.getDay() === 6;
            const status = d.status || (isWE ? 'holiday' : 'normal');

            const tr = document.createElement('tr');
            tr.className = `row-${status}`;
            tr.innerHTML = `
                <td data-label="วันที่"><span style="font-weight:800; font-size:18px; color:var(--text-main);">${i}</span><br><small style="color:var(--text-muted);">${thaiDays[date.getDay()]}</small></td>
                <td data-label="เวลาเข้า-ออกงาน">
                    <input type="text" class="time-input" onblur="updateTime('${key}','in',this)" value="${d.in||''}" placeholder="08:00">
                    <input type="text" class="time-input" onblur="updateTime('${key}','out',this)" value="${d.out||''}" placeholder="17:00">
                </td>
                <td data-label="ประเภทวัน">
                    <select class="input-box" style="font-size:13px; font-weight:600;" onchange="updateStatus('${key}',this)">
                        ${Object.keys(statsNames).map(k=>`<option value="${k}" ${status==k?'selected':''}>${statsNames[k]}</option>`).join('')}
                    </select>
                </td>
                <td data-label="หมายเหตุ" class="hide-mobile"><input type="text" class="input-box" style="font-size:13px;" onblur="updateNote('${key}',this)" value="${d.note||''}"></td>
                <td data-label="เวลารวม / ชม. OT">
                    <div id="workedh-${key}" style="color:var(--text-main); font-weight:700;">0 ชม.</div>
                    <div id="oth-${key}" style="color:var(--primary); font-weight:800;">0 ชม.</div>
                </td>
                <td data-label="เงิน OT" style="text-align:right;">
                    <div id="cash-${key}" style="color:var(--success); font-size:13px; font-weight:600;">฿0.00</div>
                </td>
            `;
            tbody.appendChild(tr);
        }
        calc();
    };

    window.updateTime = (key, field, obj) => {
        if(!db.days[key]) db.days[key] = {};
        db.days[key][field] = obj.value;
        set(ref(rtdb, 'payroll_data_2026'), db);
    };

    window.updateStatus = (key, sel) => {
        if(!db.days[key]) db.days[key] = {};
        db.days[key].status = sel.value;
        set(ref(rtdb, 'payroll_data_2026'), db);
    };

    window.updateNote = (key, obj) => {
        if(!db.days[key]) db.days[key] = {};
        db.days[key].note = obj.value;
        set(ref(rtdb, 'payroll_data_2026'), db);
    };

    window.formatMoney = (el) => {
        let v = el.value.replace(/\D/g, "");
        el.value = v === "" ? "" : Number(v).toLocaleString();
        const m = document.getElementById('monthPicker').value;
        db.configs[m] = { 
            salary: document.getElementById('salary').value, 
            moving: document.getElementById('moving').value, 
            living: document.getElementById('living').value 
        };
        set(ref(rtdb, 'payroll_data_2026'), db);
    };

    function parseTime(t) {
        if (!t || !t.includes(':')) return null;
        const [h, m] = t.split(':').map(Number);
        return h + (m / 60);
    }

    function calc() {
        const curM = parseInt(document.getElementById('monthPicker').value);
        const p = (v) => parseFloat(String(v).replace(/,/g, "")) || 0;
        
        const baseSalary = p(document.getElementById('salary').value);
        const hourlyRate = baseSalary / 30 / 8;
        
        let mOtCash = 0;
        let mWorkedHrs = 0;
        let totalFixed = baseSalary + p(document.getElementById('moving').value) + p(document.getElementById('living').value);
        let mLeaves = { sick: 0, personal: 0, vacation: 0 };

        Object.keys(db.days).forEach(key => {
            const [mIdx, dIdx] = key.split('-').map(Number);
            if (mIdx !== curM) return;

            const d = db.days[key];
            
            if (d.status === 'sick') mLeaves.sick++;
            if (d.status === 'personal') mLeaves.personal++;
            if (d.status === 'vacation') mLeaves.vacation++;

            const timeIn = parseTime(d.in);
            const timeOut = parseTime(d.out);

            if (timeIn && timeOut) {
                let totalWorked = timeOut - timeIn;
                if (totalWorked > 5) totalWorked -= 1; // หักพักเที่ยง

                mWorkedHrs += totalWorked; // สะสมชั่วโมงทำงานจริงเดือนนี้

                let dailyOtHrs = 0;
                let dailyOtCash = 0;

                if (d.status === 'normal') {
                    dailyOtHrs = Math.max(0, totalWorked - 8); // OT สำหรับชั่วโมงที่เกิน 8
                    dailyOtCash = dailyOtHrs * (hourlyRate * 1.5);
                } else if (d.status === 'holiday') {
                    const otH = totalWorked; // วันหยุดทั้งหมดเป็น OT
                    dailyOtCash = otH * (hourlyRate * 3);
                    dailyOtHrs = totalWorked; 
                }

                mOtCash += dailyOtCash;

                const workedLabel = document.getElementById(`workedh-${key}`);
                const otLabel = document.getElementById(`oth-${key}`);
                const cashLabel = document.getElementById(`cash-${key}`);
                if (workedLabel) workedLabel.innerText = totalWorked.toFixed(1) + " ชม.";
                if (otLabel) otLabel.innerText = dailyOtHrs.toFixed(1) + " ชม.";
                if (cashLabel) cashLabel.innerText = "฿" + dailyOtCash.toLocaleString(undefined, {minimumFractionDigits: 2});
            }
        });

        document.getElementById('sumNet').innerText = "฿" + (totalFixed + mOtCash).toLocaleString(undefined, {minimumFractionDigits: 2});
        document.getElementById('yearTotal').innerText = "฿" + (totalFixed * 12).toLocaleString(); 
        document.getElementById('workedMonth').innerText = mWorkedHrs.toFixed(1) + " ชั่วโมงทำงานสะสม";
        document.getElementById('sumOt').innerText = "+฿" + mOtCash.toLocaleString(undefined, {minimumFractionDigits: 2}) + " ค่าล่วงเวลา (OT)";
        document.getElementById('mLeaveBox').innerText = `ป่วย: ${mLeaves.sick} | กิจ: ${mLeaves.personal} | พักร้อน: ${mLeaves.vacation}`;
    }

</script>
</body>
</html>
