<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Pro MAX v12.4 - Red Weekends & Smart Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.96);
            --primary: #2563eb;
            --accent: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --holiday-bg: #e0f2fe;
            --weekend-text: #dc2626; /* สีแดงสำหรับเสาร์-อาทิตย์ */
        }

        body {
            font-family: 'Chakra Petch', sans-serif;
            margin: 0; min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            background-attachment: fixed; padding: 20px;
        }

        #customAlert {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 30px 50px; background: white; border-radius: 20px; box-shadow: 0 0 80px rgba(0,0,0,0.4);
            z-index: 10000; text-align: center; border-top: 6px solid var(--primary);
        }

        .container {
            max-width: 1500px; margin: 0 auto; background: var(--glass);
            border-radius: 24px; padding: 25px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .header-pro { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .config-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--primary); font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; font-weight: 700; }

        .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
        .table-section { background: white; border-radius: 15px; border: 1px solid #e2e8f0; overflow: hidden; }
        .scroll-area { max-height: 550px; overflow-y: auto; }
        
        table { width: 100%; border-collapse: collapse; }
        thead th { background: #f1f5f9; padding: 12px; font-size: 13px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #ddd; }
        tbody td { padding: 8px; border-bottom: 1px solid #f8fafc; text-align: center; }

        .text-weekend { color: var(--weekend-text) !important; font-weight: 700; }
        .row-holiday { background-color: var(--holiday-bg) !important; }
        .row-sick { background-color: #fee2e2 !important; }
        .row-personal { background-color: #fef3c7 !important; }
        .row-vacation { background-color: #dcfce7 !important; }

        .time-input { width: 80px; padding: 6px; border: 1px solid #ccc; border-radius: 5px; text-align: center; font-weight: 700; }
        .status-select { padding: 6px; border-radius: 5px; font-weight: 600; width: 100%; cursor: pointer; }

        .stat-card { background: #f8fafc; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .summary-footer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 20px; }
        .footer-item { padding: 15px; border-radius: 12px; background: white; text-align: center; border: 1px solid #eee; }
        .footer-item.net { background: var(--primary); color: white; grid-column: span 2; }
    </style>
</head>
<body>

<div id="customAlert"><h2 id="alertTitle" style="margin:0;"></h2><p id="alertMsg" style="font-size:18px; color:#555;"></p></div>

<div class="container">
    <div class="header-pro">
        <h1 style="margin:0; font-size: 24px; color: var(--primary);">🏔️ Payroll Pro MAX <span style="font-weight:300;">(v12.4)</span></h1>
        <div style="display: flex; gap: 10px;">
            <select id="monthPicker" onchange="initTable()" style="padding:8px 15px; border-radius:10px; font-weight:700; border:2px solid var(--primary);">
                <option value="0">มกราคม</option><option value="1">กุมภาพันธ์</option><option value="2">มีนาคม</option>
                <option value="3">เมษายน</option><option value="4">พฤษภาคม</option><option value="5">มิถุนายน</option>
                <option value="6">กรกฎาคม</option><option value="7">สิงหาคม</option><option value="8">กันยายน</option>
                <option value="9">ตุลาคม</option><option value="10">พฤศจิกายน</option><option value="11">ธันวาคม</option>
            </select>
            <button onclick="clearAll()" style="background:var(--danger); color:white; border:none; padding:10px 15px; border-radius:10px; cursor:pointer; font-weight:600;">ล้างข้อมูล</button>
        </div>
    </div>

    <div class="config-bar">
        <div class="input-group"><label>เงินเดือนฐาน (฿)</label><input type="text" id="salary" oninput="formatAndSave(this)" value="30,000"></div>
        <div class="input-group"><label>ค่าครองชีพ</label><input type="text" id="living" oninput="formatAndSave(this)" value="0"></div>
        <div class="input-group"><label>เบี้ยเลี้ยง</label><input type="text" id="travel" oninput="formatAndSave(this)" value="0"></div>
        <div class="input-group"><label>OT สะสมเดือนนี้</label><div id="totalOtMonth" style="font-size: 26px; font-weight:800; color: var(--accent);">0.0</div></div>
    </div>

    <div class="main-layout">
        <div class="table-section">
            <div class="scroll-area">
                <table>
                    <thead>
                        <tr>
                            <th width="120">วันที่</th><th width="90">เข้างาน</th><th width="90">เลิกงาน</th>
                            <th width="140">สถานะ</th><th width="80">OT (ชม.)</th><th>หมายเหตุ</th><th width="110">เงินพิเศษ</th>
                        </tr>
                    </thead>
                    <tbody id="workBody"></tbody>
                </table>
            </div>
        </div>

        <div class="sidebar">
            <div class="stat-card"><h3>📊 รายการลาเดือนนี้</h3><div id="monthlyLeaveBox"></div></div>
            <div class="stat-card"><h3>📅 ลาคงเหลือทั้งปี</h3><div id="yearlyLeaveBox"></div></div>
            <div class="stat-card" style="background:var(--accent); color:white;">
                <small>รายได้สะสมปี 2569</small><div id="yearTotal" style="font-size: 24px; font-weight:800;">฿0.00</div>
            </div>
        </div>
    </div>

    <div class="summary-footer">
        <div class="footer-item"><small>OT + ค่าพิเศษ</small><div id="sumOt" style="font-size:18px; font-weight:700; color:var(--success);">0.00</div></div>
        <div class="footer-item"><small>ฐานรวม</small><div id="sumFixed" style="font-size:18px; font-weight:700;">0.00</div></div>
        <div class="footer-item net"><small>ยอดรับจริงเดือนนี้</small><div id="sumNet" style="font-size:26px; font-weight:800;">฿0.00</div></div>
    </div>
</div>

<script>
    const year = 2026;
    const leaveQuota = { sick: 30, personal: 6, vacation: 10, monk: 15, military: 60 };
    const statusOptions = { normal: "ปกติ", holiday: "วันหยุด", sick: "ลาป่วย", personal: "ลากิจ", vacation: "พักร้อน", monk: "ลาอุปสมบท", military: "ลารับราชการ" };
    
    let db = JSON.parse(localStorage.getItem('payroll_v12_final')) || { days: {}, configs: {} };

    function formatAndSave(el) {
        let v = el.value.replace(/\D/g, "");
        el.value = v === "" ? "" : Number(v).toLocaleString();
        saveConfigs();
    }

    function saveConfigs() {
        const m = document.getElementById('monthPicker').value;
        db.configs[m] = { salary: document.getElementById('salary').value, living: document.getElementById('living').value, travel: document.getElementById('travel').value };
        sync();
    }

    function sync() {
        localStorage.setItem('payroll_v12_final', JSON.stringify(db));
        calc();
    }

    function initTable() {
        const tbody = document.getElementById('workBody');
        const m = document.getElementById('monthPicker').value;
        tbody.innerHTML = "";
        
        const conf = db.configs[m] || { salary: "30,000", living: "0", travel: "0" };
        document.getElementById('salary').value = conf.salary;
        document.getElementById('living').value = conf.living;
        document.getElementById('travel').value = conf.travel;

        const daysInMonth = new Date(year, parseInt(m) + 1, 0).getDate();
        for (let i = 1; i <= daysInMonth; i++) {
            const date = new Date(year, m, i);
            const dayNum = date.getDay(); // 0 = Sun, 6 = Sat
            const isWE = (dayNum === 0 || dayNum === 6);
            const key = `${m}-${i}`;
            const saved = db.days[key] || {};
            const tr = document.createElement('tr');
            
            let currentStatus = saved.status || (isWE ? 'holiday' : 'normal');
            if(currentStatus === 'holiday') tr.className = 'row-holiday';
            else if(statusOptions[currentStatus] && currentStatus !== 'normal') tr.className = `row-${currentStatus}`;

            tr.innerHTML = `
                <td class="${isWE ? 'text-weekend' : ''}">${i} (${['อา','จ','อ','พ','พฤ','ศ','ส'][dayNum]})</td>
                <td><input type="text" class="time-input" onkeydown="handleEnter(event, '${key}', 'in', this)" value="${saved.in || ''}"></td>
                <td><input type="text" class="time-input" onkeydown="handleEnter(event, '${key}', 'out', this)" value="${saved.out || ''}"></td>
                <td>
                    <select class="status-select" onchange="changeStatus('${key}',this)">
                        ${Object.keys(statusOptions).map(k => `<option value="${k}" ${currentStatus === k ? 'selected' : ''}>${statusOptions[k]}</option>`).join('')}
                    </select>
                </td>
                <td id="ot-h-${key}" style="font-weight:700; color:var(--accent);">0</td>
                <td><input type="text" style="width:90%; padding:5px; border:none; background:transparent;" onblur="updateDay('${key}','note',this)" value="${saved.note||''}"></td>
                <td id="cash-${key}" style="font-weight:700; color:var(--success);">0.00</td>
            `;
            tbody.appendChild(tr);
        }
        calc();
    }

    function handleEnter(e, key, field, obj) {
        if (e.key === "Enter") {
            let val = obj.value.trim();
            if(!db.days[key]) db.days[key] = {};
            
            if (val === "") {
                db.days[key][field] = "";
            } else {
                let processed = val.replace('.', ':');
                let parts = processed.split(':');
                let hh, mm;
                if (parts.length === 2) {
                    hh = parts[0].padStart(2, '0');
                    mm = parts[1].padEnd(2, '0').slice(0, 2);
                } else {
                    let raw = processed.replace(/[^0-9]/g, "");
                    if (raw.length <= 2) { hh = raw.padStart(2, '0'); mm = "00"; }
                    else { hh = raw.slice(0, raw.length - 2).padStart(2, '0'); mm = raw.slice(-2); }
                }
                db.days[key][field] = `${hh}:${mm}`;
                obj.value = `${hh}:${mm}`;
            }
            sync();
            obj.blur();
        }
    }

    function changeStatus(key, sel) {
        if(!db.days[key]) db.days[key] = {};
        db.days[key].status = sel.value;
        sync();
        initTable();
    }

    function updateDay(key, field, obj) {
        if(!db.days[key]) db.days[key] = {};
        db.days[key][field] = obj.value;
        sync();
    }

    function calc() {
        const currentM = document.getElementById('monthPicker').value;
        const parse = (v) => parseFloat(String(v).replace(/,/g, "")) || 0;
        let totalOtCashMonth = 0, totalOtHrsMonth = 0;
        let mLeaves = { sick:0, personal:0, vacation:0, monk:0, military:0 }, yLeaves = { ...mLeaves };
        let yearTotalIncome = 0;

        for(let i=0; i<12; i++) {
            const c = db.configs[i] || { salary: "0", living: "0", travel: "0" };
            yearTotalIncome += (parse(c.salary) + parse(c.living) + parse(c.travel));
        }

        Object.keys(db.days).forEach(key => {
            const d = db.days[key];
            const [mIdx, dIdx] = key.split('-').map(Number);
            const mSalary = parse((db.configs[mIdx] || {salary:"30,000"}).salary);
            const dayRate = mSalary / 30, hourRate = dayRate / 8;
            const isWE = (new Date(year, mIdx, dIdx).getDay() % 6 === 0);
            let status = d.status || (isWE ? 'holiday' : 'normal');

            if(yLeaves.hasOwnProperty(status)) {
                yLeaves[status]++;
                if(mIdx == currentM) mLeaves[status]++;
            }

            const otEl = document.getElementById(`ot-h-${key}`);
            const cashEl = document.getElementById(`cash-${key}`);

            if(d.in && d.out) {
                const s = d.in.split(':').map(Number), e = d.out.split(':').map(Number);
                let startF = s[0] + s[1]/60, endF = e[0] + e[1]/60;
                let otHrs = 0, dailyCash = 0;
                
                if(status === 'holiday') { dailyCash = dayRate; otHrs = Math.max(0, endF - 17.5); dailyCash += (otHrs * hourRate * 1.5); }
                else { if(endF > 18.5) otHrs = endF - 18.5; dailyCash = otHrs * hourRate * 1.5; }

                yearTotalIncome += dailyCash;
                if(mIdx == currentM) {
                    totalOtCashMonth += dailyCash; totalOtHrsMonth += otHrs;
                    if(otEl) otEl.innerText = otHrs.toFixed(1);
                    if(cashEl) cashEl.innerText = dailyCash.toLocaleString(undefined,{minimumFractionDigits:2});
                }
            } else if (mIdx == currentM) {
                if(otEl) otEl.innerText = "0";
                if(cashEl) cashEl.innerText = "0.00";
            }
        });

        const curConf = db.configs[currentM] || { salary: "30,000", living: "0", travel: "0" };
        const curFixed = parse(curConf.salary) + parse(curConf.living) + parse(curConf.travel);
        document.getElementById('totalOtMonth').innerText = totalOtHrsMonth.toFixed(1);
        document.getElementById('sumOt').innerText = totalOtCashMonth.toLocaleString(undefined,{minimumFractionDigits:2});
        document.getElementById('sumFixed').innerText = curFixed.toLocaleString();
        document.getElementById('sumNet').innerText = "฿" + (curFixed + totalOtCashMonth).toLocaleString(undefined,{minimumFractionDigits:2});
        document.getElementById('yearTotal').innerText = "฿" + yearTotalIncome.toLocaleString(undefined,{minimumFractionDigits:2});
        document.getElementById('monthlyLeaveBox').innerHTML = Object.keys(mLeaves).map(k=>`<div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px;">${statusOptions[k]}: <b>${mLeaves[k]} วัน</b></div>`).join('');
        document.getElementById('yearlyLeaveBox').innerHTML = Object.keys(yLeaves).map(k=>`<div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px;">${statusOptions[k]}: <b>เหลือ ${leaveQuota[k]-yLeaves[k]}</b></div>`).join('');
    }

    function clearAll() { if(confirm("⚠️ ลบข้อมูลทั้งหมด?")) { localStorage.clear(); location.reload(); } }
    window.onload = initTable;
</script>
</body>
</html>
