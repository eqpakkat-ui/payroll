<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payroll Pro Online v14.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --accent: #7c3aed; --success: #10b981;
            --danger: #ef4444; --warning: #f59e0b;
            --bg-sick: #fee2e2; --bg-personal: #fef3c7; --bg-vacation: #dcfce7;
        }

        body {
            font-family: 'Chakra Petch', sans-serif; margin: 0;
            background: #0f172a; min-height: 100vh; padding: 10px; color: #1e293b;
        }

        .container {
            max-width: 1200px; margin: 0 auto; background: rgba(255, 255, 255, 0.98);
            border-radius: 20px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        
        .config-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; margin-bottom: 20px; 
        }

        .input-group label { display: block; font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .input-group input { 
            width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px; 
            font-size: 15px; font-weight: 700; box-sizing: border-box; 
        }

        .stats-section { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; padding: 12px; }
        .stat-card h4 { margin: 0 0 8px 0; font-size: 14px; color: var(--primary); display: flex; align-items: center; gap: 5px; }
        .stat-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; font-weight: 600; }
        
        .income-card { 
            grid-column: span 2; background: var(--accent); color: white; 
            padding: 15px; border-radius: 15px; text-align: center; 
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .table-area { 
            background: white; border-radius: 15px; border: 1px solid #e2e8f0; 
            overflow-x: auto; margin-bottom: 20px;
        }
        
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th { background: #f8fafc; padding: 12px 8px; font-size: 13px; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; }
        td { padding: 8px 5px; border-bottom: 1px solid #f1f5f9; text-align: center; }

        .time-box { width: 65px; padding: 8px 4px; border: 1px solid #cbd5e1; border-radius: 8px; text-align: center; font-weight: 700; font-family: inherit; }
        .status-box { padding: 8px 2px; border-radius: 8px; border: 1px solid #cbd5e1; font-weight: 600; width: 85px; font-family: inherit; }
        .note-box { width: 120px; padding: 8px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; font-size: 12px; }

        .row-holiday { background-color: #fff1f2 !important; }
        .row-sick { background-color: var(--bg-sick) !important; }
        .row-personal { background-color: var(--bg-personal) !important; }
        .row-vacation { background-color: var(--bg-vacation) !important; }

        .footer-summary { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .sum-item { background: white; padding: 15px; border-radius: 15px; text-align: center; border: 1px solid #e2e8f0; }
        .sum-item.highlight { background: var(--primary); color: white; border: none; }

        @media (min-width: 768px) {
            .header { flex-direction: row; justify-content: space-between; }
            .config-grid { grid-template-columns: repeat(4, 1fr); }
            .stats-section { grid-template-columns: repeat(3, 1fr); }
            .income-card { grid-column: span 1; }
            .footer-summary { grid-template-columns: repeat(3, 1fr); }
        }

        #alertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; backdrop-filter: blur(4px); }
        #customAlert { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 25px; z-index: 1001; text-align: center; width: 80%; max-width: 320px; }
    </style>
</head>
<body>

<div id="alertOverlay"></div>
<div id="customAlert">
    <div style="font-size: 50px; margin-bottom: 10px;">☁️</div>
    <h2 id="alertTitle" style="color:var(--primary); margin:0;">ระบบบันทึกออนไลน์</h2>
    <p id="alertMsg" style="font-weight:700; font-size: 20px; margin: 20px 0; color:#334155;"></p>
    <button onclick="closeAlert()" style="background:var(--primary); color:white; border:none; padding:12px; border-radius:15px; cursor:pointer; font-weight:700; width:100%;">ตกลง</button>
</div>

<div class="container">
    <div class="header">
        <h2 style="margin:0; color:var(--primary);">🏔️ Payroll Pro (Online)</h2>
        <div style="display:flex; gap:8px;">
            <select id="monthPicker" onchange="initTable()" style="padding:8px; border-radius:10px; font-weight:700; border:2px solid var(--primary);">
                <option value="0">มกราคม</option><option value="1">กุมภาพันธ์</option><option value="2">มีนาคม</option>
                <option value="3">เมษายน</option><option value="4">พฤษภาคม</option><option value="5">มิถุนายน</option>
                <option value="6">กรกฎาคม</option><option value="7">สิงหาคม</option><option value="8">กันยายน</option>
                <option value="9">ตุลาคม</option><option value="10">พฤศจิกายน</option><option value="11">ธันวาคม</option>
            </select>
            <button onclick="clearAll()" style="background:var(--danger); color:white; border:none; padding:8px 12px; border-radius:10px; font-weight:700;">ล้างข้อมูลบน Cloud</button>
        </div>
    </div>

    <div class="config-grid">
        <div class="input-group"><label>เงินเดือนฐาน</label><input type="text" id="salary" oninput="formatMoney(this)" value="30,000"></div>
        <div class="input-group"><label>ค่าโยกย้าย</label><input type="text" id="moving" oninput="formatMoney(this)" value="0"></div>
        <div class="input-group"><label>ค่าครองชีพ</label><input type="text" id="living" oninput="formatMoney(this)" value="0"></div>
        <div class="input-group" style="text-align:right;"><label>OT (ชม.)</label><div id="otMonth" style="font-size:24px; font-weight:800; color:var(--accent);">0.0</div></div>
    </div>

    <div class="stats-section">
        <div class="stat-card">
            <h4>📊 ลาเดือนนี้</h4>
            <div id="mLeaveBox"></div>
        </div>
        <div class="stat-card">
            <h4>📅 โควตาที่เหลือ</h4>
            <div id="yLeaveBox"></div>
        </div>
        <div class="income-card">
            <small>รายได้สะสมปี 2569 (Cloud Sync)</small>
            <div id="yearTotal" style="font-size:32px; font-weight:800; margin-top:5px;">฿0</div>
        </div>
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th style="min-width:60px">วันที่</th>
                    <th>เข้า - ออก</th>
                    <th>สถานะ</th>
                    <th>หมายเหตุ</th>
                    <th>OT/เงินพิเศษ</th>
                </tr>
            </thead>
            <tbody id="workTable"></tbody>
        </table>
    </div>

    <div class="footer-summary">
        <div class="sum-item"><small>OT + ค่าวันหยุด</small><div id="sumOt" style="font-size:20px; font-weight:800; color:var(--success);">0.00</div></div>
        <div class="sum-item highlight"><small>ยอดรับสุทธิเดือนนี้</small><div id="sumNet" style="font-size:28px; font-weight:800;">฿0.00</div></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- Firebase Configuration จากที่คุณส่งมา ---
    const firebaseConfig = {
      apiKey: "AIzaSyCB1AofSi9vx1_sbiuBytYTAzncrsn1gpk",
      authDomain: "my-payroll-app-4e527.firebaseapp.com",
      databaseURL: "https://my-payroll-app-4e527-default-rtdb.firebaseio.com",
      projectId: "my-payroll-app-4e527",
      storageBucket: "my-payroll-app-4e527.firebasestorage.app",
      messagingSenderId: "472001377405",
      appId: "1:472001377405:web:d77ca10e52d2918c5c2d14"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    const year = 2026;
    const statsNames = { normal:"ปกติ", holiday:"วันหยุด", sick:"ป่วย", personal:"กิจ", vacation:"พักร้อน" };
    const quota = { sick: 30, personal: 6, vacation: 10 };
    let db = { days: {}, configs: {} };

    // --- ฟังก์ชันเพื่อให้ HTML มองเห็น ---
    window.showAlert = (msg) => {
        document.getElementById('alertMsg').innerText = msg;
        document.getElementById('alertOverlay').style.display = 'block';
        document.getElementById('customAlert').style.display = 'block';
    };
    window.closeAlert = () => {
        document.getElementById('alertOverlay').style.display = 'none';
        document.getElementById('customAlert').style.display = 'none';
    };

    // --- ระบบ Cloud Sync ของ Firebase ---
    function syncToFirebase() {
        set(ref(rtdb, 'payroll_data_2026'), db);
    }

    onValue(ref(rtdb, 'payroll_data_2026'), (snapshot) => {
        const data = snapshot.val();
        if (data) {
            db = data;
            if (!db.days) db.days = {};
            if (!db.configs) db.configs = {};
        }
        window.initTable(); 
    });

    window.formatMoney = (el) => {
        let v = el.value.replace(/\D/g, "");
        el.value = v === "" ? "" : Number(v).toLocaleString();
        window.saveAll();
    };

    window.saveAll = () => {
        const m = document.getElementById('monthPicker').value;
        if(!db.configs) db.configs = {};
        db.configs[m] = { 
            salary: document.getElementById('salary').value, 
            moving: document.getElementById('moving').value,
            living: document.getElementById('living').value 
        };
        syncToFirebase();
        window.calc();
    };

    window.initTable = () => {
        const tbody = document.getElementById('workTable');
        const m = parseInt(document.getElementById('monthPicker').value);
        tbody.innerHTML = "";
        
        const conf = db.configs[m] || { salary: "30,000", moving: "0", living: "0" };
        document.getElementById('salary').value = conf.salary;
        document.getElementById('moving').value = conf.moving;
        document.getElementById('living').value = conf.living;

        const days = new Date(year, m + 1, 0).getDate();
        for (let i = 1; i <= days; i++) {
            const date = new Date(year, m, i);
            const dNum = date.getDay();
            const key = `${m}-${i}`;
            const saved = db.days[key] || {};
            if ((dNum === 0 || dNum === 6) && !saved.status) saved.status = 'holiday';
            
            const curS = saved.status || 'normal';
            const tr = document.createElement('tr');
            tr.className = `row-${curS}`;

            tr.innerHTML = `
                <td><b>${i}</b><br><small>${['อา','จ','อ','พ','พฤ','ศ','ส'][dNum]}</small></td>
                <td>
                    <input type="text" class="time-box" onblur="window.updateTime('${key}','in',this)" placeholder="" value="${saved.in||''}">
                    <input type="text" class="time-box" onblur="window.updateTime('${key}','out',this)" placeholder="" value="${saved.out||''}">
                </td>
                <td>
                    <select class="status-box" onchange="window.updateStatus('${key}',this)">
                        ${Object.keys(statsNames).map(k=>`<option value="${k}" ${curS==k?'selected':''}>${statsNames[k]}</option>`).join('')}
                    </select>
                </td>
                <td><input type="text" class="note-box" onblur="window.updateNote('${key}',this)" placeholder="..." value="${saved.note||''}"></td>
                <td style="text-align:right; padding-right:15px;">
                    <div id="oth-${key}" style="font-size:12px; font-weight:800; color:var(--primary);">0</div>
                    <div id="cash-${key}" style="font-size:11px; font-weight:700; color:var(--success);">0.00</div>
                </td>
            `;
            tbody.appendChild(tr);
        }
        window.calc();
    };

    window.updateTime = (key, field, obj) => {
        let v = obj.value.trim();
        if(!db.days[key]) db.days[key] = {};
        if(v && !v.includes(':')) {
            if(v.length === 4) v = v.slice(0,2) + ':' + v.slice(2,4);
            else if(v.length === 3) v = '0' + v.slice(0,1) + ':' + v.slice(1,3);
        }
        db.days[key][field] = v;
        syncToFirebase();
    };

    window.updateStatus = (key, sel) => {
        if(!db.days[key]) db.days[key] = {};
        db.days[key].status = sel.value;
        if(['sick', 'personal', 'vacation'].includes(sel.value)) {
            window.showAlert(`บันทึกสถานะ: ${statsNames[sel.value]}`);
        }
        syncToFirebase();
    };

    window.updateNote = (key, obj) => {
        if(!db.days[key]) db.days[key] = {};
        db.days[key].note = obj.value;
        syncToFirebase();
    };

    window.calc = () => {
        const curM = document.getElementById('monthPicker').value;
        const p = (v) => parseFloat(String(v).replace(/,/g, "")) || 0;
        
        let mOtCash = 0, mOtHrs = 0, yTotalInc = 0;
        let mLeaves = { sick:0, personal:0, vacation:0 };
        let yLeaves = { sick:0, personal:0, vacation:0 };

        for(let j=0; j<12; j++) {
            const conf = db.configs[j] || { salary: "0", moving: "0", living: "0" };
            yTotalInc += (p(conf.salary) + p(conf.moving) + p(conf.living));
        }

        Object.keys(db.days).forEach(key => {
            const d = db.days[key]; 
            const [mIdx, dIdx] = key.split('-').map(Number);
            const status = d.status || 'normal';

            if(['sick', 'personal', 'vacation'].includes(status)) {
                yLeaves[status]++;
                if(mIdx == curM) mLeaves[status]++;
            }

            if(d.in && d.out) {
                const mSalary = p(db.configs[mIdx]?.salary || 30000);
                const dRate = mSalary / 30;
                const hRate = dRate / 8;
                
                let ot = 0, cash = 0;
                const [h, min] = d.out.split(':').map(Number);
                const endF = h + (min/60);

                if(endF > 18.5) ot = endF - 18.5; 

                if(status === 'holiday') {
                    cash = dRate + (ot * hRate * 1.5);
                } else {
                    cash = (ot * hRate * 1.5);
                }

                yTotalInc += cash;
                if(mIdx == curM) {
                    mOtCash += cash; mOtHrs += ot;
                    const otEl = document.getElementById(`oth-${key}`);
                    const cashEl = document.getElementById(`cash-${key}`);
                    if(otEl) otEl.innerText = ot.toFixed(1) + " ชม.";
                    if(cashEl) cashEl.innerText = cash.toLocaleString();
                }
            }
        });

        document.getElementById('mLeaveBox').innerHTML = `
            <div class="stat-line"><span>ป่วย:</span><span>${mLeaves.sick}</span></div>
            <div class="stat-line"><span>กิจ:</span><span>${mLeaves.personal}</span></div>
            <div class="stat-line"><span>พักร้อน:</span><span>${mLeaves.vacation}</span></div>
        `;
        document.getElementById('yLeaveBox').innerHTML = `
            <div class="stat-line"><span>ป่วย:</span><span>${quota.sick - yLeaves.sick}</span></div>
            <div class="stat-line"><span>กิจ:</span><span>${quota.personal - yLeaves.personal}</span></div>
            <div class="stat-line"><span>พักร้อน:</span><span>${quota.vacation - yLeaves.vacation}</span></div>
        `;
        document.getElementById('yearTotal').innerText = "฿" + Math.round(yTotalInc).toLocaleString();

        const conf = db.configs[curM] || { salary: "30,000", moving: "0", living: "0" };
        const totalFixed = p(conf.salary) + p(conf.moving) + p(conf.living);
        
        document.getElementById('otMonth').innerText = mOtHrs.toFixed(1);
        document.getElementById('sumOt').innerText = mOtCash.toLocaleString(undefined,{minimumFractionDigits:2});
        document.getElementById('sumNet').innerText = "฿" + (totalFixed + mOtCash).toLocaleString(undefined,{minimumFractionDigits:2});
    };

    window.clearAll = () => { 
        if(confirm("ต้องการล้างข้อมูลออนไลน์ทั้งหมดหรือไม่? (ข้อมูลจะหายถาวรจาก Cloud)")) { 
            set(ref(rtdb, 'payroll_data_2026'), null); 
            // รีเซ็ตตัวแปร db ด้วยเพื่อให้หน้าจอโล่งทันที
            db = { days: {}, configs: {} };
            window.initTable();
        } 
    };

    // ตอนเปิดเว็บยังไม่ต้องวาดตาราง ให้รอข้อมูลจาก Firebase ก่อน (onValue จะจัดการเอง)
</script>
</body>
</html>
