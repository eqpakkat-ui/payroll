<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คำนวณเงินเดือน</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f8fafc">
    <link rel="apple-touch-icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-glow: rgba(37, 99, 235, 0.3);
            --accent: #7c3aed;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --bg-light: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', 'Chakra Petch', sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            padding: env(safe-area-inset-top) 15px env(safe-area-inset-bottom);
        }

        .container { max-width: 1200px; margin: 20px auto; padding: 25px; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .brand-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Stats Card --- */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-main-card { padding: 30px; background: #fff; }
        .stat-label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 38px; font-weight: 800; margin: 5px 0; color: var(--text-main); }

        /* --- Config --- */
        .config-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #fff;
            border-radius: 18px;
        }

        .input-box {
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 16px;
            width: 100%;
        }

        /* --- Table Colors --- */
        .table-container { overflow-x: auto; border-radius: 20px; background: #fff; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { padding: 18px; background: #f8fafc; color: var(--text-muted); font-size: 13px; text-transform: uppercase; border-bottom: 2px solid #edf2f7; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; text-align: center; }

        /* --- แยกสีแต่ละประเภทอย่างชัดเจน --- */
        .row-normal { background-color: #ffffff; }
        .row-holiday { background-color: #fff1f2; } /* แดงอ่อน - วันหยุด */
        .row-sick { background-color: #fffbeb; }    /* เหลืองอ่อน - ลาป่วย */
        .row-personal { background-color: #f5f3ff; } /* ม่วงอ่อน - ลากิจ */
        .row-vacation { background-color: #f0fdf4; } /* เขียวอ่อน - พักร้อน */

        .time-input {
            width: 80px;
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            font-weight: 700;
        }

        /* --- Popup Notification --- */
        #statusNotify {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
            display: none;
            border: 1px solid var(--primary);
            backdrop-filter: blur(10px);
            transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        #statusNotify.show { display: block; transform: translate(-50%, -50%) scale(1); opacity: 1; }

        .notify-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .notify-detail { font-size: 16px; color: var(--text-muted); }

        .btn-glow {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            border: none; border-radius: 12px; color: white; padding: 14px;
            font-weight: 700; cursor: pointer; width: 100%;
        }

        @media (max-width: 768px) { .stat-value { font-size: 30px; } }
    </style>
</head>
<body>

<div id="statusNotify">
    <div id="notifyIcon" style="font-size: 50px; margin-bottom: 15px;">✅</div>
    <div class="notify-title" id="notifyTitle">บันทึกสำเร็จ</div>
    <div class="notify-detail" id="notifyDetail">เหลือโควตาลาพักร้อน 10 วัน</div>
</div>

<div id="loginSection" style="display: flex; justify-content: center; align-items: center; height: 90vh;">
    <div class="glass-panel" style="padding: 40px; width: 350px; text-align: center;">
        <h2 class="brand-text">เข้าสู่ระบบ</h2>
        <input type="email" id="emailInput" class="input-box" style="margin-bottom: 15px;" placeholder="อีเมล">
        <input type="password" id="passwordInput" class="input-box" placeholder="รหัสผ่าน">
        <button class="btn-glow" style="margin-top: 20px;" onclick="window.login()">AUTHENTICATE</button>
    </div>
</div>

<div id="appSection" class="container glass-panel animate-fade" style="display: none;">
    <div class="header">
        <div class="brand-text">INTELLIGENT PAYROLL DASHBOARD</div>
        <div style="display: flex; gap: 15px;">
            <select id="monthPicker" class="input-box" style="width: 150px; font-weight: 700;" onchange="initTable()">
                <option value="0">มกราคม</option><option value="1">กุมภาพันธ์</option><option value="2">มีนาคม</option>
                <option value="3">เมษายน</option><option value="4" selected>พฤษภาคม</option><option value="5">มิถุนายน</option>
                <option value="6">กรกฎาคม</option><option value="7">สิงหาคม</option><option value="8">กันยายน</option>
                <option value="9">ตุลาคม</option><option value="10">พฤศจิกายน</option><option value="11">ธันวาคม</option>
            </select>
            <button onclick="logout()" style="background:none; border:1px solid var(--danger); color:var(--danger); padding:8px 15px; border-radius:10px; cursor:pointer;">ออก</button>
        </div>
    </div>

    <div class="hero-grid">
        <div class="glass-panel stat-main-card">
            <div class="stat-label">รายรับสุทธิเดือนนี้</div>
            <div id="sumNet" class="stat-value">฿0.00</div>
            <div id="otMonth" style="font-size: 14px; color: var(--primary); font-weight: 700;">0.0 ชม. OT สะสม</div>
        </div>
        <div class="glass-panel stat-main-card">
            <div class="stat-label">รายได้รวมทั้งปี 2026</div>
            <div id="yearTotal" class="stat-value" style="color:var(--success)">฿0</div>
            <div id="sumOt" style="font-size: 14px; color: var(--accent); font-weight: 700;">+฿0.00 โบนัส OT</div>
        </div>
    </div>

    <div class="config-bar">
        <div><label class="stat-label">เงินเดือน</label><input type="text" id="salary" class="input-box" oninput="formatMoney(this)" value="30,000"></div>
        <div><label class="stat-label">ค่าอื่นๆ</label><input type="text" id="moving" class="input-box" oninput="formatMoney(this)" value="0"></div>
        <div style="grid-column: span 1; display: flex; flex-direction: column; justify-content: center;">
            <div class="stat-label">สิทธิ์การลาคงเหลือ (ทั้งปี)</div>
            <div id="mLeaveBox" style="font-size: 14px; font-weight: 800; color: var(--primary); margin-top: 5px;">ป่วย: 30 | กิจ: 6 | พักร้อน: 12</div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>วันที่</th>
                    <th>เวลา เข้า-ออก</th>
                    <th>สถานะวัน</th>
                    <th>หมายเหตุ</th>
                    <th>ค่าตอบแทน OT</th>
                </tr>
            </thead>
            <tbody id="workTable"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJnRAKZknvX6jhQYPpOuM9fUGHiL5521A", 
      authDomain: "my-payroll-app-4e527.firebaseapp.com",
      databaseURL: "https://my-payroll-app-4e527-default-rtdb.firebaseio.com",
      projectId: "my-payroll-app-4e527",
      storageBucket: "my-payroll-app-4e527.firebasestorage.app",
      messagingSenderId: "472001377405",
      appId: "1:472001377405:web:d77ca10e52d2918c5c2d14"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);
    const auth = getAuth(app);

    const year = 2026;
    const QUOTAS = { sick: 30, personal: 6, vacation: 12 };
    const statsNames = { normal:"วันทำงานปกติ", holiday:"วันหยุด/นักขัตฯ", sick:"ลาป่วย", personal:"ลากิจ", vacation:"ลาพักร้อน" };
    let db = { days: {}, configs: {} };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            startSync();
        } else {
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('appSection').style.display = 'none';
        }
    });

    window.login = () => {
        const email = document.getElementById('emailInput').value.trim();
        const pass = document.getElementById('passwordInput').value.trim();
        signInWithEmailAndPassword(auth, email, pass).catch(e => alert(e.message));
    };

    window.logout = () => signOut(auth);

    function startSync() {
        onValue(ref(rtdb, 'payroll_data_2026'), (snap) => {
            db = snap.val() || { days: {}, configs: {} };
            initTable();
        });
    }

    window.initTable = () => {
        const tbody = document.getElementById('workTable');
        const m = parseInt(document.getElementById('monthPicker').value);
        tbody.innerHTML = "";
        
        const conf = db.configs[m] || { salary: "30,000", moving: "0" };
        document.getElementById('salary').value = conf.salary;
        document.getElementById('moving').value = conf.moving || "0";
        
        const daysInMonth = new Date(year, m + 1, 0).getDate();
        const thaiDays = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];

        for (let i = 1; i <= daysInMonth; i++) {
            const key = `${m}-${i}`;
            const d = db.days[key] || {};
            const date = new Date(year, m, i);
            const isWeekend = date.getDay() === 0 || date.getDay() === 6;
            const status = d.status || (isWeekend ? 'holiday' : 'normal');

            const tr = document.createElement('tr');
            tr.className = `row-${status}`; // ใช้คลาสแยกสี
            tr.innerHTML = `
                <td><span style="font-weight:800; font-size:18px;">${i}</span><br><small>${thaiDays[date.getDay()]}</small></td>
                <td>
                    <input type="text" class="time-input" onblur="updateTime('${key}','in',this)" value="${d.in||''}" placeholder="08:00">
                    <input type="text" class="time-input" onblur="updateTime('${key}','out',this)" value="${d.out||''}" placeholder="17:00">
                </td>
                <td>
                    <select class="input-box" style="font-size:13px; font-weight:700;" onchange="updateStatus('${key}',this)">
                        ${Object.keys(statsNames).map(k=>`<option value="${k}" ${status==k?'selected':''}>${statsNames[k]}</option>`).join('')}
                    </select>
                </td>
                <td><input type="text" class="input-box" style="font-size:13px;" onblur="updateNote('${key}',this)" value="${d.note||''}"></td>
                <td style="text-align:right;">
                    <div id="oth-${key}" style="color:var(--primary); font-weight:800;">0 ชม.</div>
                    <div id="cash-${key}" style="color:var(--success); font-size:12px; font-weight:700;">฿0.00</div>
                </td>
            `;
            tbody.appendChild(tr);
        }
        calc();
    };

    window.updateTime = (key, field, obj) => {
        if(!db.days[key]) db.days[key] = {};
        db.days[key][field] = obj.value;
        set(ref(rtdb, 'payroll_data_2026'), db);
    };

    window.updateStatus = (key, sel) => {
        const oldStatus = db.days[key]?.status || 'normal';
        const newStatus = sel.value;
        
        if(!db.days[key]) db.days[key] = {};
        db.days[key].status = newStatus;
        
        set(ref(rtdb, 'payroll_data_2026'), db).then(() => {
            if (['sick', 'personal', 'vacation'].includes(newStatus)) {
                showNotify(newStatus);
            }
        });
    };

    window.updateNote = (key, obj) => {
        if(!db.days[key]) db.days[key] = {};
        db.days[key].note = obj.value;
        set(ref(rtdb, 'payroll_data_2026'), db);
    };

    window.formatMoney = (el) => {
        let v = el.value.replace(/\D/g, "");
        el.value = v === "" ? "" : Number(v).toLocaleString();
        const m = document.getElementById('monthPicker').value;
        db.configs[m] = { 
            salary: document.getElementById('salary').value, 
            moving: document.getElementById('moving').value 
        };
        set(ref(rtdb, 'payroll_data_2026'), db);
    };

    function showNotify(status) {
        const counts = countAllLeaves();
        const remaining = QUOTAS[status] - counts[status];
        const icons = { sick: '🤒', personal: '🏠', vacation: '🏖️' };
        
        const el = document.getElementById('statusNotify');
        document.getElementById('notifyIcon').innerText = icons[status];
        document.getElementById('notifyTitle').innerText = `บันทึก${statsNames[status]}`;
        document.getElementById('notifyDetail').innerText = `ใช้ไปแล้ว ${counts[status]} วัน | คงเหลือ ${remaining} วัน`;
        
        el.style.display = 'block';
        setTimeout(() => el.classList.add('show'), 10);
        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => el.style.display = 'none', 300);
        }, 2500);
    }

    function countAllLeaves() {
        let counts = { sick: 0, personal: 0, vacation: 0 };
        Object.values(db.days).forEach(d => {
            if (counts.hasOwnProperty(d.status)) counts[d.status]++;
        });
        return counts;
    }

    function calc() {
        const curM = parseInt(document.getElementById('monthPicker').value);
        const p = (v) => parseFloat(String(v).replace(/,/g, "")) || 0;
        
        const baseSalary = p(document.getElementById('salary').value);
        const hourlyRate = baseSalary / 30 / 8;
        
        let mOtCash = 0, mOtHrs = 0;
        const totalFixed = baseSalary + p(document.getElementById('moving').value);
        
        const allCounts = countAllLeaves();
        document.getElementById('mLeaveBox').innerText = `ป่วย: ${allCounts.sick}/${QUOTAS.sick} | กิจ: ${allCounts.personal}/${QUOTAS.personal} | พักร้อน: ${allCounts.vacation}/${QUOTAS.vacation}`;

        Object.keys(db.days).forEach(key => {
            const [mIdx] = key.split('-').map(Number);
            const d = db.days[key];
            if (mIdx !== curM || !d.in || !d.out) return;

            const tIn = parseTime(d.in), tOut = parseTime(d.out);
            if (tIn && tOut) {
                let worked = tOut - tIn;
                if (worked > 5) worked -= 1;

                let dOtHrs = 0, dOtCash = 0;
                if (d.status === 'normal') {
                    dOtHrs = Math.max(0, worked - 8);
                    dOtCash = dOtHrs * (hourlyRate * 1.5);
                } else if (d.status === 'holiday') {
                    const normH = Math.min(8, worked), otH = Math.max(0, worked - 8);
                    dOtCash = (normH * hourlyRate) + (otH * hourlyRate * 3);
                    dOtHrs = worked;
                }
                mOtHrs += dOtHrs; mOtCash += dOtCash;
                document.getElementById(`oth-${key}`).innerText = dOtHrs.toFixed(1) + " ชม.";
                document.getElementById(`cash-${key}`).innerText = "฿" + dOtCash.toLocaleString(undefined,{minimumFractionDigits:2});
            }
        });

        document.getElementById('sumNet').innerText = "฿" + (totalFixed + mOtCash).toLocaleString(undefined,{minimumFractionDigits:2});
        document.getElementById('otMonth').innerText = mOtHrs.toFixed(1) + " ชั่วโมง OT สะสม";
        document.getElementById('sumOt').innerText = "+฿" + mOtCash.toLocaleString(undefined,{minimumFractionDigits:2}) + " โบนัส OT";
        document.getElementById('yearTotal').innerText = "฿" + (totalFixed * 12).toLocaleString();
    }

    function parseTime(t) {
        if (!t || !t.includes(':')) return null;
        const [h, m] = t.split(':').map(Number);
        return h + (m / 60);
    }
</script>
</body>
</html>
