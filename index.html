<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Admin Pro MAX</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 1. การตั้งค่า Firebase (ใช้ค่าจากโปรเจกต์ My-Payroll-Data ของคุณ)
        const firebaseConfig = {
            apiKey: "AIzaSyBu9bT1YxWs6nQEEdedFMAagh4DTbw-Fvc", // จากรูปที่ 23
            authDomain: "my-payroll-data.firebaseapp.com",
            databaseURL: "https://my-payroll-data-default-rtdb.firebaseio.com",
            projectId: "my-payroll-data",
            storageBucket: "my-payroll-data.appspot.com",
            messagingSenderId: "1016629953460",
            appId: "1:1016629953460:web:8662963665363412345678" // ตรวจสอบ App ID ใน Firebase Settings อีกครั้ง
        };

        // เริ่มต้น Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 2. ฟังก์ชัน Login
        window.login = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // ตรวจสอบ UID เพื่อสิทธิ์ Admin (วาง UID ของคุณที่นี่)
                const adminUID = "วาง_USER_UID_จาก_FIREBASE_ตรงนี้"; 
                
                if (user.uid === adminUID) {
                    document.getElementById('loginOverlay').style.display = 'none';
                    loadPayrollData(); // ดึงข้อมูลเมื่อล็อกอินสำเร็จ
                } else {
                    await signOut(auth);
                    errorMsg.innerText = "คุณไม่มีสิทธิ์เข้าถึงระบบนี้";
                }
            } catch (error) {
                console.error("Login Error:", error.code);
                errorMsg.innerText = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
            }
        };

        // 3. ฟังก์ชันดึงข้อมูลจาก Database
        async function loadPayrollData() {
            const dbRef = ref(db);
            try {
                const snapshot = await get(child(dbRef, `payroll_data` * `2026` * `04`)); // ตัวอย่างโครงสร้างปี/เดือน
                if (snapshot.exists()) {
                    console.log("Data:", snapshot.val());
                    // นำข้อมูลไปแสดงในตารางของคุณที่นี่
                }
            } catch (error) {
                console.error("Database Error:", error);
            }
        }

        // ตรวจสอบสถานะการล็อกอินค้างไว้
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginOverlay').style.display = 'none';
                loadPayrollData();
            }
        });
    </script>

    <style>
        /* สไตล์เดิมของคุณ (คงไว้เพื่อความคุ้นเคย) */
        body { font-family: 'Chakra Petch', sans-serif; background: #0f172a; color: white; margin: 0; }
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); display: flex;
            align-items: center; justify-content: center; z-index: 9999;
            backdrop-filter: blur(10px);
        }
        .login-card {
            background: white; padding: 2rem; border-radius: 15px;
            width: 350px; color: #334155; text-align: center;
        }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #error-msg { color: #ef4444; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-card">
            <h2>🔒 Payroll Admin</h2>
            <input type="email" id="email" placeholder="อีเมล">
            <input type="password" id="password" placeholder="รหัสผ่าน">
            <button onclick="login()">เข้าสู่ระบบ</button>
            <div id="error-msg"></div>
        </div>
    </div>

    <div id="mainContent" style="padding: 20px;">
        <h1>Dashboard ระบบเงินเดือน</h1>
        </div>

</body>
</html>
